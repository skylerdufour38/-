<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Store</title>
    <meta
      name="description"
      content="Browse a curated archive of iOS app package metadata."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">A</div>
        <div>
          <p class="eyebrow">Archive</p>
          <h1>App Store</h1>
        </div>
      </div>
      <a class="primary-btn" href="apps.json" download>
        Download Data
      </a>
    </header>

    <main class="page-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">iOS package catalog</p>
          <h2>Browse archived app metadata</h2>
        </div>
        <label class="search-box" aria-label="Search apps">
          <span>Search</span>
          <input
            id="searchInput"
            type="search"
            placeholder="Search by app name or bundle ID"
          />
        </label>
      </section>

      <section class="stats" aria-label="Archive summary">
        <div class="stat-card">
          <span id="totalApps">0</span>
          <small>Apps</small>
        </div>
        <div class="stat-card">
          <span id="totalSize">0 MB</span>
          <small>Total size</small>
        </div>
        <div class="stat-card">
          <span id="minOS">0</span>
          <small>Min OS</small>
        </div>
        <div class="stat-card">
          <span id="platform">iOS</span>
          <small>Platform</small>
        </div>
      </section>

      <section class="app-grid-section">
        <div id="appGrid" class="app-grid" aria-live="polite"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
